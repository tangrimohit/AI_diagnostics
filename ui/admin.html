function Wiki() {
  const [tree, setTree] = useState(null);
  const [selectedPath, setSelectedPath] = useState(null);
  const [mode, setMode] = useState("view"); // view | edit | history | cited-by | commit-view
  const [page, setPage] = useState(null);
  const [editing, setEditing] = useState("");
  const [history, setHistory] = useState(null);
  const [citations, setCitations] = useState(null);
  const [searchQ, setSearchQ] = useState("");
  const [searchMode, setSearchMode] = useState("literal");
  const [searchResults, setSearchResults] = useState(null);
  const [report, setReport] = useState(null); // {kind: 'lint'|'gaps', data}
  const [toast, setToast] = useState(null);
  const [historyCommit, setHistoryCommit] = useState(null);
  const [historyPage, setHistoryPage] = useState(null);
  const [sources, setSources] = useState(null);
  const [showUpload, setShowUpload] = useState(false);
  const [approveSource, setApproveSource] = useState(null);

  function showToast(msg) { setToast(msg); setTimeout(() => setToast(null), 2200); }

  useEffect(() => {
    fetch("/admin/wiki/tree").then(r => r.json()).then(setTree);
  }, []);

  // Sources polling: refresh every 4s while any source is still processing.
  useEffect(() => {
    let timer;
    function tick() {
      fetch("/admin/ingest/sources").then(r => r.json()).then(d => {
        setSources(d);
        const inFlight = (d.sources || []).some(s => s.status === "uploaded" || s.status === "extracted");
        timer = setTimeout(tick, inFlight ? 3000 : 12000);
      }).catch(() => { timer = setTimeout(tick, 15000); });
    }
    tick();
    return () => clearTimeout(timer);
  }, [approveSource, showUpload]);

  useEffect(() => {
    if (!selectedPath) { setPage(null); return; }
    setMode("view"); setHistory(null); setCitations(null); setHistoryPage(null); setHistoryCommit(null);
    fetch("/admin/wiki/page?path=" + encodeURIComponent(selectedPath))
      .then(r => r.ok ? r.json() : Promise.reject(r))
      .then(p => { setPage(p); setEditing(p.raw); })
      .catch(() => setPage(null));
  }, [selectedPath]);

  function runSearch() {
    if (!searchQ.trim()) { setSearchResults(null); return; }
    fetch("/admin/wiki/search?q=" + encodeURIComponent(searchQ) + "&mode=" + searchMode)
      .then(r => r.json()).then(d => setSearchResults(d.results));
  }

  async function save() {
    const r = await fetch("/admin/wiki/page?path=" + encodeURIComponent(selectedPath), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: editing }),
    });
    if (!r.ok) { showToast("Save failed"); return; }
    const data = await r.json();
    if (data.changed) {
      showToast("Saved · " + (data.diff_summary || ""));
      // re-fetch page + invalidate history
      fetch("/admin/wiki/page?path=" + encodeURIComponent(selectedPath)).then(r => r.json()).then(p => { setPage(p); setEditing(p.raw); });
      setHistory(null);
      // also refresh tree if filename or fm changed
      fetch("/admin/wiki/tree").then(r => r.json()).then(setTree);
    } else {
      showToast("No changes");
    }
    setMode("view");
  }

  async function deletePage() {
    if (!confirm("Delete " + selectedPath + "?\n\nThis writes a 'deleted' row to wiki_page_history and removes the file from disk + git. Existing diagnosis records that cite this page will keep their snapshot.")) return;
    const r = await fetch("/admin/wiki/page?path=" + encodeURIComponent(selectedPath), { method: "DELETE" });
    if (!r.ok) { showToast("Delete failed"); return; }
    showToast("Deleted");
    setSelectedPath(null); setPage(null);
    fetch("/admin/wiki/tree").then(r => r.json()).then(setTree);
  }

  function loadHistory() {
    fetch("/admin/wiki/history?path=" + encodeURIComponent(selectedPath)).then(r => r.json()).then(d => setHistory(d.entries));
  }

  function loadCitedBy() {
    fetch("/admin/wiki/cited-by?path=" + encodeURIComponent(selectedPath)).then(r => r.json()).then(d => setCitations(d.citations));
  }

  function loadCommit(commit) {
    setHistoryCommit(commit);
    fetch("/admin/wiki/commit?path=" + encodeURIComponent(selectedPath) + "&commit=" + commit)
      .then(r => r.ok ? r.json() : Promise.reject(r))
      .then(setHistoryPage)
      .catch(() => showToast("Could not load that version"));
  }

  function runReport(kind) {
    fetch("/admin/wiki/" + kind).then(r => r.json()).then(d => setReport({ kind, data: d }));
  }

  function downloadReport(kind) {
    window.location.href = "/admin/wiki/" + kind + "?format=md";
  }

  const lineCount = useMemo(() => editing.split("\n").length, [editing]);

  return (
    <div>
      <div className="toolbar">
        <button className="primary" onClick={() => setShowUpload(true)} style={{background:"var(--epson-deep-blue)", color:"#fff", border:"none"}}>+ Upload new source</button>
        <button onClick={() => runReport("lint")}>Run lint</button>
        <button onClick={() => downloadReport("lint")}>↓ lint.md</button>
        <button onClick={() => runReport("gaps")}>Gap analysis</button>
        <button onClick={() => downloadReport("gaps")}>↓ gaps.md</button>
        <span className="right"></span>
        <span style={{color:"var(--text-muted)", fontSize:11}}>
          {tree ? tree.file_count + " pages" : "loading…"}
        </span>
      </div>
      <SourcesPanel sources={sources} onApprove={setApproveSource} onReject={async (sid) => {
        if (!confirm("Reject this source? The proposed drafts will be deleted from disk.")) return;
        const r = await fetch("/admin/ingest/source/" + sid + "/reject", { method: "POST" });
        if (r.ok) { showToast("Rejected"); fetch("/admin/ingest/sources").then(r=>r.json()).then(setSources); }
        else showToast("Reject failed");
      }} />
      <div className="wiki-layout">
        <aside className="wiki-sidebar">
          <div className="wiki-search">
            <input
              placeholder="search filenames + bodies"
              value={searchQ}
              onChange={e => setSearchQ(e.target.value)}
              onKeyDown={e => { if (e.key === "Enter") runSearch(); }}
            />
            <select value={searchMode} onChange={e => setSearchMode(e.target.value)}>
              <option value="literal">literal</option>
              <option value="regex">regex</option>
            </select>
          </div>
          <div className="wiki-tree">
            {searchResults != null ? (
              <SearchResults results={searchResults} onSelect={(p) => { setSelectedPath(p); setSearchResults(null); }} onClear={() => setSearchResults(null)} />
            ) : (
              tree ? <TreeNode node={tree} depth={0} selectedPath={selectedPath} onSelect={setSelectedPath} initiallyOpen /> : <div className="loading">Loading tree…</div>
            )}
          </div>
        </aside>
        <section className="wiki-content">
          {!selectedPath ? (
            <div className="wiki-empty">Select a page from the tree on the left to view it.<br /><br />Use the search box for keyword or regex matches across all 42 pages.</div>
          ) : !page ? (
            <div className="loading">Loading {selectedPath}…</div>
          ) : (
            <React.Fragment>
              <div className="wiki-toolbar">
                <span className="path">{selectedPath}</span>
                {mode === "view" && (
                  <React.Fragment>
                    <button onClick={() => setMode("edit")}>Edit</button>
                    <button onClick={() => { loadHistory(); setMode("history"); }}>History</button>
                    <button onClick={() => { loadCitedBy(); setMode("cited-by"); }}>Cited by</button>
                    <button className="danger" onClick={deletePage}>Delete</button>
                  </React.Fragment>
                )}
                {mode === "edit" && (
                  <React.Fragment>
                    <button onClick={() => { setEditing(page.raw); setMode("view"); }}>Cancel</button>
                    <button className="primary" onClick={save}>Save</button>
                  </React.Fragment>
                )}
                {(mode === "history" || mode === "cited-by") && (
                  <button onClick={() => { setMode("view"); setHistoryPage(null); setHistoryCommit(null); }}>← back to page</button>
                )}
              </div>

              {mode === "view" && <PageView page={page} />}
              {mode === "edit" && (
                <div className="editor-wrap">
                  <div className="editor-gutter" id="editor-gutter">
                    {Array.from({length: lineCount}, (_, i) => <div key={i}>{i + 1}</div>)}
                  </div>
                  <textarea
                    className="editor"
                    value={editing}
                    onChange={e => setEditing(e.target.value)}
                    onScroll={e => { const g = document.getElementById("editor-gutter"); if (g) g.scrollTop = e.target.scrollTop; }}
                    spellCheck={false}
                  />
                </div>
              )}
              {mode === "history" && (
                <HistoryPanel
                  history={history}
                  onPickCommit={loadCommit}
                  pickedCommit={historyCommit}
                  pageAtCommit={historyPage}
                />
              )}
              {mode === "cited-by" && <CitedByPanel citations={citations} />}
            </React.Fragment>
          )}
        </section>
      </div>
      {report && <ReportModal report={report} onClose={() => setReport(null)} />}
      {showUpload && <UploadModal onClose={() => setShowUpload(false)} onSuccess={(msg) => { setShowUpload(false); showToast(msg); fetch("/admin/ingest/sources").then(r=>r.json()).then(setSources); }} />}
      {approveSource && <ApproveModal sourceId={approveSource} onClose={() => setApproveSource(null)} onApproved={(n) => { setApproveSource(null); showToast(`Approved ${n} page${n===1?"":"s"}`); fetch("/admin/ingest/sources").then(r=>r.json()).then(setSources); fetch("/admin/wiki/tree").then(r=>r.json()).then(setTree); }} />}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

function SourcesPanel({ sources, onApprove, onReject }) {
  if (!sources) return null;
  const all = sources.sources || [];
  const inflight = all.filter(s => ["uploaded", "extracted"].includes(s.status));
  const ready = all.filter(s => s.status === "drafted");
  const failed = (sources.failed || []);
  const recent = all.filter(s => ["approved", "rejected"].includes(s.status)).slice(0, 5);
  if (!inflight.length && !ready.length && !failed.length && !recent.length) return null;

  function fmtTs(ts) {
    if (!ts) return "";
    let s = String(ts);
    if (!/[Zz]|[+\-]\d{2}:?\d{2}$/.test(s)) s = s.replace(" ", "T") + "Z";
    const d = new Date(s);
    if (isNaN(d.getTime())) return String(ts);
    const p = new Intl.DateTimeFormat("en-GB", { 
      year:"numeric", month:"2-digit", day:"2-digit",
      hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false })
      .formatToParts(d).reduce((a,x) => (a[x.type] = x.value, a), {});
    return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}:${p.second}`;
  }
  function row(s, label, cls, actions) {
    return (
      <div className="ingest-row" key={s.source_id}>
        <div className="src">
          <div className="name">{s.original_name} <span style={{color:"var(--text-muted)"}}>· {s.source_type}{s.authority ? " · " + s.authority : ""}</span></div>
          <div className="meta">{s.source_id.slice(0, 12)}… · uploaded {fmtTs(s.uploaded_at)} UTC+3{s.notes ? " · " + s.notes.slice(0, 80) : ""}</div>
          {s.status_detail && <div className="meta" style={{color: cls === "failed" ? "var(--error)" : "var(--text-muted)"}}>{s.status_detail}</div>}
        </div>
        <span className={"status-pill " + cls}>{label}</span>
        <span>{actions}</span>
      </div>
    );
  }

  return (
    <React.Fragment>
      {inflight.length > 0 && (
        <div className="ingest-panel">
          <h3>Processing ({inflight.length})</h3>
          {inflight.map(s => row(s, s.status === "uploaded" ? "extracting…" : "drafting…", "processing", <span style={{color:"var(--text-muted)", fontSize:11}}>—</span>))}
        </div>
      )}
      {ready.length > 0 && (
        <div className="ingest-panel">
          <h3>Ready for review ({ready.length})</h3>
          {ready.map(s => row(s, "ready", "ready",
            <span style={{display:"flex", gap:6}}>
              <button onClick={() => onApprove(s.source_id)} style={{padding:"5px 12px", background:"var(--epson-deep-blue)", color:"#fff", border:"none", borderRadius:4, cursor:"pointer", fontSize:12}}>Review →</button>
              <button onClick={() => onReject(s.source_id)} style={{padding:"5px 12px", background:"var(--bg-canvas)", color:"var(--error)", border:"1px solid rgba(220,38,38,0.3)", borderRadius:4, cursor:"pointer", fontSize:12}}>Reject</button>
            </span>
          ))}
        </div>
      )}
      {failed.length > 0 && (
        <div className="ingest-panel">
          <h3>Ingestion issues ({failed.length})</h3>
          {failed.map(s => row(s, s.status.replace("_", " "), "failed",
            <button onClick={() => onReject(s.source_id)} style={{padding:"5px 12px", background:"var(--bg-canvas)", color:"var(--text-secondary)", border:"1px solid var(--border-default)", borderRadius:4, cursor:"pointer", fontSize:12}}>Dismiss</button>
          ))}
        </div>
      )}
      {recent.length > 0 && (
        <div className="ingest-panel">
          <h3>Recent ({recent.length})</h3>
          {recent.map(s => row(s, s.status, s.status === "approved" ? "approved" : "rejected", <span style={{color:"var(--text-muted)", fontSize:11}}>{s.status === "approved" ? "→ committed" : "drafts removed"}</span>))}
        </div>
      )}
    </React.Fragment>
  );
}

function UploadModal({ onClose, onSuccess }) {
  const [file, setFile] = useState(null);
  const [sourceType, setSourceType] = useState("manuals");
  const [authority, setAuthority] = useState("");
  const [notes, setNotes] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  useEffect(() => {
    function onKey(e) { if (e.key === "Escape" && !busy) onClose(); }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose, busy]);

  async function submit() {
    if (!file) { setErr("Pick a file"); return; }
    setBusy(true); setErr(null);
    const form = new FormData();
    form.append("file", file);
    form.append("source_type", sourceType);
    form.append("authority", authority);
    form.append("notes", notes);
    try {
      const r = await fetch("/admin/ingest/upload", { method: "POST", body: form });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) {
        if (r.status === 409 && body.detail && body.detail.existing_source) {
          setErr("Duplicate: this file was already ingested as " + body.detail.existing_source.source_id.slice(0,12) + "… on " + body.detail.existing_source.uploaded_at);
        } else {
          setErr((body.detail && (body.detail.message || body.detail)) || "Upload failed");
        }
        setBusy(false);
        return;
      }
      onSuccess(`Uploaded · processing in background (${body.source_id.slice(0,8)}…)`);
    } catch (e) {
      setErr("Upload failed: " + e.message);
      setBusy(false);
    }
  }

  return (
    <div className="modal-back" onClick={(e) => { if (e.target === e.currentTarget && !busy) onClose(); }}>
      <div className="modal upload-modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h2>Upload new source</h2>
          <button className="close" onClick={onClose} disabled={busy}>close ✕</button>
        </div>
        <div className="modal-body">
          <div className="upload-form">
            <div>
              <label>File</label>
              <input type="file" onChange={e => setFile(e.target.files[0])} accept=".pdf,.xlsx,.xlsm,.docx,.csv,.md,.txt" />
              <div style={{fontSize:11, color:"var(--text-muted)", marginTop:4}}>PDF, Excel, Word, CSV, plain text or markdown. 100 MB limit.</div>
            </div>
            <div>
              <label>Source type</label>
              <select value={sourceType} onChange={e => setSourceType(e.target.value)}>
                <option value="manuals">manuals (service manuals, training material)</option>
                <option value="tis">tis (Technical Information notices)</option>
                <option value="msd">msd (Dynamics 365 case exports)</option>
                <option value="depot2">depot2 (repair-network reports)</option>
                <option value="web">web (clippings, vendor / partner pages)</option>
                <option value="other">other</option>
              </select>
            </div>
            <div>
              <label>Authority level</label>
              <div className="auth-row">
                {[["high","manufacturer / authoritative"], ["medium","partner / engineer"], ["low","web / informal"]].map(([v, lbl]) => (
                  <label key={v} className="opt">
                    <input type="radio" name="auth" checked={authority === v} onChange={() => setAuthority(v)} />
                    <span>{v} <span style={{color:"var(--text-muted)"}}>({lbl})</span></span>
                  </label>
                ))}
                <label className="opt">
                  <input type="radio" name="auth" checked={authority === ""} onChange={() => setAuthority("")} />
                  <span style={{color:"var(--text-muted)"}}>(unspecified)</span>
                </label>
              </div>
            </div>
            <div>
              <label>Notes</label>
              <textarea value={notes} onChange={e => setNotes(e.target.value)} placeholder="e.g. From Sato-san, 2026-05-14 email re: PPB investigation"></textarea>
            </div>
            {err && <div className="error-box">{err}</div>}
            <div style={{display:"flex", gap:10, justifyContent:"flex-end", marginTop:8}}>
              <button onClick={onClose} disabled={busy} style={{padding:"10px 18px", background:"var(--bg-canvas)", border:"1px solid var(--border-default)", borderRadius:6, cursor:"pointer", color:"var(--text-secondary)"}}>Cancel</button>
              <button className="btn-primary" onClick={submit} disabled={busy || !file}>{busy ? "Uploading…" : "Upload"}</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function ApproveModal({ sourceId, onClose, onApproved }) {
  const [data, setData] = useState(null);
  const [selections, setSelections] = useState({}); // index -> { include, destination }
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  useEffect(() => {
    fetch("/admin/ingest/source/" + sourceId).then(r => r.json()).then(d => {
      setData(d);
      const sel = {};
      (d.drafts || []).forEach((p, i) => {
        sel[i] = { include: true, destination: p.proposed_destination };
      });
      setSelections(sel);
    });
  }, [sourceId]);
  useEffect(() => {
    function onKey(e) { if (e.key === "Escape" && !busy) onClose(); }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose, busy]);

  if (!data) return (
    <div className="modal-back"><div className="modal approve-modal"><div className="modal-body"><div className="loading">Loading draft…</div></div></div></div>
  );

  async function approveSelected() {
    setBusy(true); setErr(null);
    const payload = {
      selections: (data.drafts || []).map((p, i) => ({
        draft_path: p.draft_path,
        destination: selections[i].destination,
        include: selections[i].include,
      })),
    };
    try {
      const r = await fetch("/admin/ingest/source/" + sourceId + "/approve", {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload),
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) {
        setErr((body.detail && (body.detail.message || body.detail)) || "Approve failed");
        setBusy(false);
        return;
      }
      onApproved(body.approved_count || 0);
    } catch (e) { setErr("Network error"); setBusy(false); }
  }

  const drafts = data.drafts || [];
  const selectedCount = Object.values(selections).filter(s => s.include).length;

  return (
    <div className="modal-back" onClick={(e) => { if (e.target === e.currentTarget && !busy) onClose(); }}>
      <div className="modal approve-modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <h2>Review drafts · {data.original_name}</h2>
            <div style={{fontSize:11, color:"var(--text-muted)", marginTop:2, fontFamily:"var(--font-mono)"}}>
              source {sourceId.slice(0, 12)}… · {drafts.length} proposed page{drafts.length === 1 ? "" : "s"}
              {data.status_detail ? " · " + data.status_detail.slice(0, 120) : ""}
            </div>
          </div>
          <button className="close" onClick={onClose} disabled={busy}>close ✕</button>
        </div>
        <div className="modal-body">
          <div className="draft-banner">
            <strong>DRAFT — not yet approved.</strong> These pages are not consulted by the diagnose pipeline.
            Edit destinations below as needed, uncheck any you don't want, then approve.
          </div>
          {drafts.length === 0 && <div className="empty">The drafter produced no usable pages from this source.</div>}
          {drafts.map((p, i) => {
            const sel = selections[i] || { include: true, destination: p.proposed_destination };
            return (
              <div key={i} className={"draft-card" + (sel.include ? "" : " excluded")}>
                <div className="draft-card-head">
                  <input type="checkbox" checked={sel.include} onChange={e => setSelections({...selections, [i]: {...sel, include: e.target.checked}})} />
                  <div className="dest-row">
                    <span className="label">→</span>
                    <input
                      value={sel.destination}
                      onChange={e => setSelections({...selections, [i]: {...sel, destination: e.target.value}})}
                      disabled={!sel.include}
                    />
                  </div>
                  <span className="badge muted" style={{textTransform:"capitalize"}}>{p.frontmatter && p.frontmatter.type || "?"}</span>
                </div>
                <div className="draft-card-body">
                  <div className="fm-block">{JSON.stringify(p.frontmatter, null, 2)}</div>
                  <div className="preview" dangerouslySetInnerHTML={{__html: window.marked ? window.marked.parse(p.body || "") : "<pre>" + (p.body || "") + "</pre>"}}></div>
                </div>
              </div>
            );
          })}
          {err && <div className="error-box">{err}</div>}
          <div style={{display:"flex", gap:10, justifyContent:"flex-end", marginTop:14, paddingTop:14, borderTop:"1px solid var(--border-default)"}}>
            <button onClick={onClose} disabled={busy} style={{padding:"10px 18px", background:"var(--bg-canvas)", border:"1px solid var(--border-default)", borderRadius:6, cursor:"pointer", color:"var(--text-secondary)"}}>Cancel</button>
            <button className="btn-primary" onClick={approveSelected} disabled={busy || selectedCount === 0}>{busy ? "Approving…" : `Approve ${selectedCount} of ${drafts.length}`}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function TreeNode({ node, depth, selectedPath, onSelect, initiallyOpen }) {
  const [open, setOpen] = useState(initiallyOpen || depth < 2);
  if (node.type === "file") {
    return (
      <div
        className={"tree-file" + (selectedPath === node.path ? " active" : "")}
        style={{paddingLeft: 16 + depth * 12}}
        onClick={() => onSelect(node.path)}
      >
        <span>📄</span>
        <span>{node.name.replace(/\.md$/, "")}</span>
        {node.fm_type && <span className={"typetag " + node.fm_type}>{node.fm_type}</span>}
      </div>
    );
  }
  return (
    <div className="tree-node" style={{paddingLeft: depth === 0 ? 0 : 4}}>
      <div className="tree-folder" onClick={() => setOpen(!open)} style={{paddingLeft: depth * 12}}>
        <span className={"chev" + (open ? " open" : "")}>›</span>
        <span>📁</span>
        <span className="fname">{node.name}</span>
        <span className="count">({node.file_count})</span>
      </div>
      {open && (node.children || []).map((c, i) => (
        <TreeNode key={i} node={c} depth={depth + 1} selectedPath={selectedPath} onSelect={onSelect} />
      ))}
    </div>
  );
}

function SearchResults({ results, onSelect, onClear }) {
  return (
    <div>
      <div style={{display:"flex", justifyContent:"space-between", marginBottom:8, fontSize:11, color:"var(--text-secondary)"}}>
        <span>{results.length} matches</span>
        <span style={{cursor:"pointer", color:"var(--epson-deep-blue)"}} onClick={onClear}>clear ✕</span>
      </div>
      {results.length === 0 && <div className="empty">No matches.</div>}
      {results.map((r, i) => (
        <div key={i} className="tree-file" onClick={() => onSelect(r.path)} style={{flexDirection:"column", alignItems:"flex-start", padding:"6px 8px", borderBottom:"1px solid var(--border-default)"}}>
          <div style={{fontFamily:"var(--font-mono)", fontSize:12, color:"var(--text-primary)"}}>{r.path}</div>
          {r.body_matches.slice(0, 1).map((b, j) => (
            <div key={j} style={{fontSize:11, color:"var(--text-muted)", marginTop:2}}>…{b.snippet}…</div>
          ))}
          <div style={{fontSize:10, color:"var(--text-muted)", marginTop:2}}>{r.match_count} match{r.match_count === 1 ? "" : "es"}</div>
        </div>
      ))}
    </div>
  );
}

function PageView({ page }) {
  const fm = page.frontmatter || {};
  const fmEntries = Object.entries(fm);
  const html = useMemo(() => {
    if (!window.marked) return "<pre>" + (page.body || "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])) + "</pre>";
    try { return window.marked.parse(page.body || ""); } catch (e) { return "<pre>" + page.body + "</pre>"; }
  }, [page.body]);
  return (
    <React.Fragment>
      {fmEntries.length > 0 && (
        <div className="wiki-fm">
          {fmEntries.map(([k, v]) => (
            <div className="fm-row" key={k}>
              <span className="fm-k">{k}</span>
              <span className="fm-v">{Array.isArray(v) ? "[" + v.join(", ") + "]" : (v == null ? "—" : String(v))}</span>
            </div>
          ))}
        </div>
      )}
      <div className="markdown-rendered" dangerouslySetInnerHTML={{__html: html}} />
    </React.Fragment>
  );
}

function HistoryPanel({ history, onPickCommit, pickedCommit, pageAtCommit }) {
  if (!history) return <div className="loading">Loading history…</div>;
  return (
    <div>
      <div className="side-panel">
        <h3>Edit history ({history.length} {history.length === 1 ? "entry" : "entries"})</h3>
        {history.length === 0 && <div className="empty">No history.</div>}
        {history.map((h, i) => (
          <div className="history-row" key={i}>
            <span className="ts">{fmtTs(h.ts)}</span>
            <span><span className={"pill " + (h.origin || "original")}>{h.origin}</span></span>
            <span className="commit" onClick={() => onPickCommit(h.git_commit_id)}>{h.git_commit_short}</span>
            <span className="summary">
              <strong style={{textTransform:"capitalize", color:"var(--text-secondary)"}}>{h.change_type}</strong>
              {h.diff_summary ? ": " + h.diff_summary : ""}
            </span>
          </div>
        ))}
      </div>
      {pageAtCommit && (
        <div className="side-panel">
          <h3>Page at commit {pickedCommit && pickedCommit.slice(0,8)}…</h3>
          <PageView page={pageAtCommit} />
        </div>
      )}
    </div>
  );
}

function CitedByPanel({ citations }) {
  if (!citations) return <div className="loading">Loading citations…</div>;
  if (citations.length === 0) return <div className="empty">No diagnoses have cited this page yet.</div>;
  return (
    <div className="side-panel">
      <h3>Cited by ({citations.length} diagnos{citations.length === 1 ? "is" : "es"})</h3>
      <div style={{fontSize:11, color:"var(--text-muted)", marginBottom:8}}>Click a row to open it in the Diagnoses tab.</div>
      {citations.map((c, i) => (
        <div
          className="citation-row"
          key={i}
          onClick={() => { window.location.hash = "diagnosis=" + c.diagnosis_id; window.dispatchEvent(new HashChangeEvent("hashchange")); }}
        >
          <span style={{fontFamily:"var(--font-mono)", color:"var(--text-secondary)", fontSize:11}}>{fmtTs(c.ts)}</span>
          <span style={{fontFamily:"var(--font-mono)", fontSize:11, color:"var(--text-muted)"}}>{c.diagnosis_id.slice(0, 12)}…</span>
          <span><span className="badge muted">{c.depth_tier}</span></span>
          <span>{feedbackBadge(c.feedback_status)}</span>
        </div>
      ))}
    </div>
  );
}

function ReportModal({ report, onClose }) {
  useEffect(() => {
    function onKey(e) { if (e.key === "Escape") onClose(); }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  return (
    <div className="modal-back" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal report" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h2>{report.kind === "lint" ? "Lint report" : "Gap analysis"} · scanned {report.data.scanned_pages} pages</h2>
          <button className="close" onClick={onClose}>close ✕</button>
        </div>
        <div className="modal-body report-section">
          {report.kind === "lint" ? <LintReportContent r={report.data} /> : <GapsReportContent r={report.data} />}
          <div style={{marginTop:16, paddingTop:12, borderTop:"1px solid var(--border-default)", display:"flex", gap:10}}>
            <a href={"/admin/wiki/" + report.kind + "?format=md"} download style={{textDecoration:"none"}}>
              <button className="btn-primary">↓ Download as markdown</button>
            </a>
            <button onClick={onClose} style={{padding:"10px 18px", background:"var(--bg-canvas)", border:"1px solid var(--border-default)", borderRadius:6, cursor:"pointer", color:"var(--text-secondary)"}}>Close</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function LintReportContent({ r }) {
  return (
    <React.Fragment>
      <h3>Orphan pages ({r.orphans.length})</h3>
      {r.orphans.length === 0 ? <div className="empty" style={{padding:8, textAlign:"left"}}>None.</div> : (
        <ul>{r.orphans.map((o, i) => <li key={i}><code>{o.path}</code> ({o.fm_type || "—"})</li>)}</ul>
      )}
      <h3>Dead wiki links ({r.dead_links.length})</h3>
      {r.dead_links.length === 0 ? <div className="empty" style={{padding:8, textAlign:"left"}}>None.</div> : (
        <ul>{r.dead_links.map((d, i) => <li key={i}><code>{d.source}</code> → <code>{d.target}</code></li>)}</ul>
      )}
      <h3>Stale pages — last_updated &gt;90d ({r.stale_pages.length})</h3>
      {r.stale_pages.length === 0 ? <div className="empty" style={{padding:8, textAlign:"left"}}>None.</div> : (
        <ul>{r.stale_pages.map((s, i) => <li key={i}><code>{s.path}</code> · last_updated {s.last_updated}</li>)}</ul>
      )}
    </React.Fragment>
  );
}

function GapsReportContent({ r }) {
  return (
    <React.Fragment>
      <h3>Coverage gaps — models with &lt;5 pages ({r.coverage_low_models.length})</h3>
      {r.coverage_low_models.length === 0 ? <div className="empty" style={{padding:8, textAlign:"left"}}>None.</div> : (
        <ul>{r.coverage_low_models.map((c, i) => <li key={i}><strong>{c.model}</strong> — {c.page_count} page{c.page_count === 1 ? "" : "s"}</li>)}</ul>
      )}
      <h3>Error codes with low source_count &lt;3 ({r.error_codes_low_source_count.length})</h3>
      {r.error_codes_low_source_count.length === 0 ? <div className="empty" style={{padding:8, textAlign:"left"}}>None.</div> : (
        <ul>{r.error_codes_low_source_count.map((e, i) => <li key={i}><code>{e.path}</code> · code <code>{e.code}</code> · source_count {e.source_count}</li>)}</ul>
      )}
      <h3>Error code pages missing a resolution sequence ({r.resolution_missing.length})</h3>
      {r.resolution_missing.length === 0 ? <div className="empty" style={{padding:8, textAlign:"left"}}>None.</div> : (
        <ul>{r.resolution_missing.map((x, i) => <li key={i}><code>{x.path}</code> · code <code>{x.code}</code></li>)}</ul>
      )}
      <h3>Models without environment-specific pages ({r.environment_gaps.length})</h3>
      {r.environment_gaps.length === 0 ? <div className="empty" style={{padding:8, textAlign:"left"}}>None.</div> : (
        <ul>{r.environment_gaps.map((e, i) => <li key={i}><strong>{e.model}</strong></li>)}</ul>
      )}
      {(r.notes || []).map((n, i) => (
        <div key={i} style={{fontSize:11, color:"var(--text-muted)", marginTop:14, fontStyle:"italic"}}>{n}</div>
      ))}
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
